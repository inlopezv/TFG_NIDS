// ============================================
// Configuración del Servidor Xonotic (server.cfg)
// ============================================

// Nombre del servidor
hostname "Servidor Xonotic de Kali"

// Mensaje de bienvenida al entrar al servidor
motd "¡Bienvenidos a la arena! Preparados para el combate."

// Visibilidad: 0 = Privado (solo IP directa), 1 = Público (Aparece en la lista mundial)
sv_public 0

// Límite máximo de jugadores
maxplayers 12

//Configuracion de bots para tráfico
bot_number 8
skill 3 //Nivel de habilidad para los bots
timelimit 15
fraglimit 0
bot_join_empty 1

// Contraseña para administrar el servidor desde dentro del juego (quítale las dos barras '//' para activarla)
// rcon_password "tu_contraseña_secreta"

// El mapa y reglas por defecto que cargará al iniciar (¡No borrar esta línea!)
serverconfig default.cfg